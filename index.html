:root{--g:#1f7a55;--gd:#17412f;--bg:#f2f9f4;--o:#c8431f;--ink:#1a2a22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.7 'MindSans','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;word-break:keep-all;overflow-wrap:break-word;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 18px 48px}
.draft{background:#fff3cd;border:2px solid #e0a800;padding:8px 12px;border-radius:10px;font-size:16px;margin-bottom:14px}
h1{font-size:30px;line-height:1.35;letter-spacing:-0.025em;text-wrap:balance;font-weight:700;color:var(--gd);margin:8px 0 12px}
.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;border:1px solid #cfe6d6}
button{font:inherit;font-weight:400;letter-spacing:-0.01em;width:100%;min-height:58px;border-radius:14px;border:2px solid var(--g);background:#fff;color:var(--gd);margin:8px 0;padding:10px 14px;cursor:pointer;text-align:left}
button:hover,button:focus-visible{background:#e3f3e8;outline:3px solid #9bd3b0}
button.p{background:var(--g);color:#fff;text-align:center;font-weight:700}
button.s{border-color:#8a9a92;color:#3d4d45;text-align:center;min-height:48px;font-size:17px}
.bar{height:10px;background:#d8ebde;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g)}
.crisis{background:var(--o);color:#fff;border-radius:18px;padding:18px;margin:14px 0}
.crisis a{color:#fff;display:block;margin-top:10px;text-decoration:none}.crisis .cn{display:block;font-size:17px;font-weight:400}.crisis .tn{display:block;font-size:32px;font-weight:700;white-space:nowrap;text-decoration:underline}
.score{font-size:56px;font-weight:800;color:var(--gd);line-height:1}
.sm{font-size:15px;color:#44564c}
a{color:var(--gd)}
</style></head>
<body><main id="app"></main>
<script>
/* ===================== 설정: 여기만 고치세요 ===================== */
const DRAFT = false;  // 전문기관(센터) 검수 후에만 false로 바꾸세요
// 아래 3개는 "공식 한국어판 PHQ-9"의 문구를 그대로 옮겨 적으세요 (임의 번역 금지)
const STEM = "지난 2주 동안, 아래와 같은 일이 얼마나 자주 있었나요?";
const HINT = "정답은 없어요. 편하게 체크해 주세요.";
const OPTIONS = ["전혀 아니다","여러날 동안","일주일 이상","거의 매일"]; // 순서대로 0,1,2,3점
// 문항 9개를 공식 순서대로 입력. 9번(죽음·자해 생각)은 반드시 마지막. 비어 있으면 페이지가 시작되지 않습니다.
const ITEMS = ["일을 하는 것에 흥미나 재미를 거의 느끼지 못했어요.","기분이 가라앉거나, 우울하거나, 절망적인 느낌이 들었어요.","잠들기 어렵거나 자꾸 깼어요. 또는 너무 많이 잤어요.","피곤하고 기력이 떨어진 느낌이 들었어요.","식욕이 줄었어요. 또는 반대로 너무 많이 먹었어요.","내가 나쁜 사람이라고 느끼거나 실패자라고 느꼈어요. 또는 나 때문에 나 자신이나 가족이 불행해졌다고 느꼈어요.","신문을 읽거나 TV를 볼 때 집중하기 어려웠어요.","남들이 알아챌 만큼 행동이나 말이 느려졌어요. 또는 반대로, 너무 초조하고 안절부절못해서 평소보다 많이 돌아다니거나 서성거렸어요.","차라리 죽는 것이 낫겠다는 등의 생각이 들었어요. 또는 어떤 식으로든 스스로를 해치려는 생각을 했어요."];
// 위기 연락처
const CRISIS = [["자살예방상담전화","109","109"],["정신건강위기상담전화","1577-0199","15770199"]];
// 지역 센터 (운영시간은 센터에 확인 후 문구 추가)
const SHOW_CENTER = false; // 센터와 협의된 뒤에만 true로 바꾸세요 (false면 센터 이름·번호를 화면에 쓰지 않음)
const CENTER = {name:"유성구정신건강복지센터",tel:"042-825-3527"};
// 결과 구간: [최대점수, 제목, 안내문]  ※ 문구는 센터 확인 후 확정
const BANDS = [
 [4,"우울 증상 없음","지금은 큰 어려움 신호가 적어요. 힘들어지면 언제든 다시 해보세요."],
 [9,"가벼운 우울","잠, 식사, 휴식 같은 생활을 살펴보고 2주 뒤에 다시 확인해 보세요."],
 [14,"중간 정도 우울","10점 이상이면 전문가와 상담해 보길 권해요. 가까운 정신건강복지센터에 문의해 보세요."],
 [19,"중간~심한 우울","전문가와 상담해 보길 권해요. 혼자 견디지 말고 센터에 연락해 보세요."],
 [27,"심한 우울","전문가의 도움이 필요한 수준일 수 있어요. 센터나 병원에 바로 연락해 보세요."]
]; // 구간: 0~4 / 5~9 / 10~14 / 15~19 / 20~27 (팜플렛 점수표와 동일)
// 9번 문항에 응답이 있을 때는 총점 구간 문구 대신 이 문구를 보여줍니다
const RISK_TITLE = "점수와 상관없이, 꼭 이야기해 보세요";
const RISK_TEXT = "9번 문항에 힘든 생각이 있다고 답하셨어요. 총점이 낮아도 이 답은 중요해요. 위 번호로 지금 바로 이야기해 볼 수 있어요.";
/* ============ 이하 로직: 저장·전송·분석 도구 없음 ============ */
const app=document.getElementById('app');
let i=0,ans=[],shown=0;
const missing=ITEMS.some(t=>!t.trim());
const draft=DRAFT?'<div class="draft"><b>시안</b> · 학생 리빙랩 프로토타입이에요. 문항은 예시이며 전문기관 협의 후 확정돼요. 진단이 아니에요.</div>':'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function start(){
  i=0;ans=[];
  if(missing){
    app.innerHTML=draft+'<div class="crisis"><b>설정 필요</b><br>ITEMS에 공식 한국어판 문항 9개를 모두 입력해야 시작할 수 있어요.</div>';
    return;
  }
  app.innerHTML=draft+
   '<h1>요즘 내 마음, 5분만 확인해 볼까요?</h1>'+
   '<div class="card"><p>진단이 아니라, 내 마음 상태를 알아보는 첫걸음이에요.</p>'+
   '<p>정답은 없어요. 요즘 내 모습을 떠올리며 편하게 체크해 주세요.</p>'+
   '<p class="sm">총 '+ITEMS.length+'문항 · 이름이나 연락처를 묻지 않아요.</p></div>'+
   '<button class="p" id="go">시작하기</button>';
  document.getElementById('go').onclick=ask;
}

function ask(){
  const n=ITEMS.length;shown=Date.now(); // 더블탭으로 문항이 두 개 넘어가는 것 방지
  app.innerHTML=draft+
   '<div class="sm">'+(i+1)+' / '+n+'</div>'+
   '<div class="bar"><i style="width:'+(i/n*100)+'%"></i></div>'+
   '<div class="card" role="group" aria-live="polite"><div class="sm">'+esc(STEM)+'<br>'+esc(HINT)+'</div>'+
   '<p><b>'+(i+1)+'. '+esc(ITEMS[i])+'</b></p>'+
   OPTIONS.map((o,k)=>'<button data-v="'+k+'">'+esc(o)+'</button>').join('')+'</div>'+
   (i>0?'<button class="s" id="bk">← 이전 문항</button>':'');
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(Date.now()-shown<450)return;ans[i]=+b.dataset.v;i++;i<n?ask():done();});
  const bk=document.getElementById('bk');
  if(bk)bk.onclick=()=>{if(Date.now()-shown<450)return;i--;ask();};
  window.scrollTo(0,0);
}

function done(){
  const sc=ans.reduce((a,b)=>a+b,0);
  const band=BANDS.find(b=>sc<=b[0])||BANDS[BANDS.length-1];
  const risk=ans[ITEMS.length-1]>0; // 9번 문항: 점수와 무관하게 위기 안내를 맨 위에 표시
  const crisis='<div class="crisis"><b>'+(risk?'힘든 생각이 있다고 답하셨어요. 지금 바로 이야기할 수 있어요.':'많이 힘들다면 지금 전화해 보세요.')+'</b>'+
    CRISIS.map(c=>'<a href="tel:'+c[2]+'"><span class="cn">'+esc(c[0])+'</span><span class="tn">'+esc(c[1])+'</span></a>').join('')+'</div>';
  app.innerHTML=draft+(risk?crisis:'')+
   '<h1>결과</h1>'+
   '<div class="card"><div class="sm">총점 (0~27점)</div><div class="score">'+sc+'점</div>'+
   (risk?'<p><b>'+esc(RISK_TITLE)+'</b></p><p>'+esc(RISK_TEXT)+'</p>':'<p><b>'+esc(band[1])+'</b></p><p>'+esc(band[2])+'</p>')+'</div>'+
   '<div class="card"><b>점수가 낮아도, 힘들다면 연락해도 돼요.</b>'+
   (SHOW_CENTER?'<p>'+esc(CENTER.name)+'<br><a href="tel:'+CENTER.tel.replace(/-/g,'')+'">'+esc(CENTER.tel)+'</a></p>':'<p>가까운 정신건강복지센터나 병원에 문의해 보세요.</p>')+'</div>'+
   (risk?'':crisis)+
   '<p class="sm">이 결과는 진단이 아니에요. 응답은 이 화면에서만 계산되고 저장·전송되지 않아요. (페이지를 불러올 때 접속 기록은 남을 수 있어요.)</p>'+
   '<button class="p" id="re">처음으로</button>';
  document.getElementById('re').onclick=start;
  window.scrollTo(0,0);
  ans=[];
}
start();
</script></body></html>
